
name: Ping Wild Bugs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check Wild Bugs server
        run: |
          curl --fail --silent --show-error \
            --max-time 20 \
            https://wildbugs.onrender.com/healthz
